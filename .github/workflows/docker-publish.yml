name: Publish Docker images

on:
  push:
    tags: ['v*']
    # TODO: remove before merging to main — branch-only trigger for pipeline tests
    branches: ['feat/add-docker-repository']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build (multi-arch is slow; branch runs default to amd64)
        type: choice
        default: linux/amd64,linux/arm64
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
      api_url:
        description: AUTOBOOK_API_URL baked into the web build (empty = repo variable)
        type: string
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: autobook-backend
            context: ./backend
            build-args: ''
          - image: autobook-frontend
            context: ./frontend
            build-args: |
              AUTOBOOK_API_URL=${{ inputs.api_url || vars.AUTOBOOK_API_URL || 'http://localhost:30000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          target: runner
          platforms: ${{ inputs.platforms || (github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64') }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
