services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - backend_data:/data
    environment:
      DATABASE_URL: file:/data/autobook.db
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        AUTOBOOK_API_URL: ${AUTOBOOK_API_URL:-http://localhost:3000}
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
