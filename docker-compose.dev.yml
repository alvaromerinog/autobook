services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "30000:3000"
    volumes:
      - backend_data:/data
      - ./backend/src:/app/src
    environment:
      DATABASE_URL: file:/data/autobook.db
      NODE_ENV: development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8080:80"
    volumes:
      - ./frontend/lib:/app/lib
    environment:
      AUTOBOOK_API_URL: ${AUTOBOOK_API_URL:-http://localhost:30000}
    depends_on:
      - backend

volumes:
  backend_data:
