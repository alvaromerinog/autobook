version: '3'

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: backend
  frontend:
    taskfile: ./frontend/Taskfile.yml
    dir: frontend

tasks:
  # ── Local dev ────────────────────────────────────────────────────────────────

  dev:
    aliases: [dev:start]
    desc: Run backend and frontend in two tmux panes (TMUX_SESSION=autobook); DEVICE=<id> skips the fzf device picker
    cmds:
      - |
        command -v tmux >/dev/null || { echo "tmux is not installed" >&2; exit 1; }
        session="${TMUX_SESSION:-autobook}"
        if tmux has-session -t "$session" 2>/dev/null; then
          echo "tmux session '$session' already exists, attaching to it"
        else
          device="${DEVICE:-}"
          if [ -z "$device" ]; then
            command -v jq >/dev/null || { echo "jq is not installed" >&2; exit 1; }
            command -v fzf >/dev/null || { echo "fzf is not installed" >&2; exit 1; }
            # Flutter restores the terminal to cooked mode on exit, which would
            # leave fzf deaf, so list devices before starting fzf.
            devices="$(cd frontend && fvm flutter devices --machine 2>/dev/null)"
            device="$(printf '%s\n' "$devices" |
              jq -r '.[] | select(.isSupported != false)
                     | [.id, (.name + "  —  " + .targetPlatform)] | @tsv' |
              fzf --delimiter='\t' --with-nth=2 --prompt='flutter device> ' \
                --header='Device for `task frontend:run` (Esc cancels)' |
              cut -f1)"
            if [ -z "$device" ]; then
              echo "no flutter device selected, aborting" >&2
              exit 1
            fi
          fi
          tmux new-session -d -s "$session" -n dev -c "{{.TASKFILE_DIR}}"
          tmux send-keys -t "${session}:dev.0" 'task backend:start' C-m
          tmux split-window -h -t "${session}:dev" -c "{{.TASKFILE_DIR}}"
          tmux send-keys -t "${session}:dev.1" "task frontend:run DEVICE='$device'" C-m
          tmux select-layout -t "${session}:dev" even-horizontal
          tmux select-pane -t "${session}:dev.0"
        fi
        if [ -n "$TMUX" ]; then
          tmux switch-client -t "$session"
        else
          tmux attach -t "$session"
        fi

  dev:stop:
    desc: Kill the tmux dev session started by task dev
    cmds:
      - tmux kill-session -t "${TMUX_SESSION:-autobook}" 2>/dev/null || true

  # ── Docker ───────────────────────────────────────────────────────────────────

  docker/start:
    desc: Start all services with Docker Compose in detached mode
    cmds:
      - docker compose up --build -d

  docker/stop:
    desc: Stop and remove all Docker Compose services
    cmds:
      - docker compose down

  docker/dev:
    desc: Build and start services in dev mode with source volumes for hot reload
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

  docker/prod:
    desc: Run the published GHCR images (TAG=<version>, default latest)
    cmds:
      - docker compose -f docker-compose.prod.yml up -d

  docker/prod:pull:
    desc: Pull the published GHCR images (TAG=<version>, default latest)
    cmds:
      - docker compose -f docker-compose.prod.yml pull
