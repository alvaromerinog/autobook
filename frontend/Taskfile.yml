version: '3'

tasks:
  lint:
    desc: Analyze frontend Flutter code (flutter analyze + custom_lint)
    cmds:
      - fvm flutter analyze
      - fvm dart run custom_lint

  format:
    desc: Format frontend Flutter code
    cmds:
      - fvm dart format .

  run:
    desc: Run the Flutter app on DEVICE (asks with fzf when omitted)
    cmds:
      - |
        device="{{.DEVICE}}"
        if [ -z "$device" ]; then
          command -v jq >/dev/null || { echo "jq is not installed" >&2; exit 1; }
          command -v fzf >/dev/null || { echo "fzf is not installed" >&2; exit 1; }
          # Flutter restores the terminal to cooked mode on exit, which would
          # leave fzf deaf, so list devices before starting fzf.
          devices=$(fvm flutter devices --machine 2>/dev/null)
          device=$(printf '%s\n' "$devices" |
            jq -r '.[] | select(.isSupported != false)
                   | [.id, (.name + "  —  " + .targetPlatform)] | @tsv' |
            fzf --delimiter='\t' --with-nth=2 --prompt='flutter device> ' \
              --header='Flutter device to run on (Esc cancels)' |
            cut -f1)
          if [ -z "$device" ]; then
            echo "no flutter device selected" >&2
            exit 1
          fi
        fi
        fvm flutter run -d "$device"

  test:
    desc: Run Flutter unit and widget tests
    cmds:
      - fvm flutter test

  test:coverage:
    desc: Run Flutter tests with coverage report
    cmds:
      - fvm flutter test --coverage

  build-runner:
    desc: Run build_runner to generate Riverpod/JSON code
    cmds:
      - fvm dart run build_runner build --delete-conflicting-outputs

  build:web:
    desc: Build Flutter web app with source maps for debugging
    cmds:
      - fvm flutter build web --release --source-maps
        --dart-define=AUTOBOOK_API_URL=${AUTOBOOK_API_URL:-http://localhost:3000}
      # The framework ships flutter.js.map alongside the SDK's flutter.js but
      # `flutter build web` does not deploy it to build/web/. Copy it manually
      # so the sourceMappingURL comment in flutter.js resolves instead of 404.
      - cp "$(readlink .fvm/flutter_sdk)/bin/cache/flutter_web_sdk/flutter_js/flutter.js.map" build/web/flutter.js.map
