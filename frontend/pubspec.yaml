name: autobook
description: App to manage the maintenances of your car.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  uuid: ^4.0.0
  intl: ^0.19.0
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.0
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  dio: ^5.4.0
  retrofit: ">=4.1.0 <4.9.0"
  go_router: ^14.0.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^4.0.0
  riverpod_lint: ^3.0.0
  custom_lint: ^0.8.0
  mocktail: ^1.0.4
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  retrofit_generator: ^10.0.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
