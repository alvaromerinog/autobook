version: '3'

tasks:
  lint:
    desc: Lint backend TypeScript sources with ESLint
    cmds:
      - pnpm lint

  format:
    desc: Format backend sources with Prettier
    cmds:
      - pnpm format

  start:
    desc: Start backend dev server with hot reload
    cmds:
      - pnpm start:dev

  test:
    desc: Run backend unit tests
    cmds:
      - pnpm test

  test:watch:
    desc: Run backend unit tests in watch mode
    cmds:
      - pnpm test:watch

  test:e2e:
    desc: Run backend end-to-end tests
    cmds:
      - pnpm test:e2e

  test:cov:
    desc: Run backend tests with coverage report
    cmds:
      - pnpm test:cov

  db:migrate:
    desc: Apply pending Prisma migrations to the local database
    cmds:
      - pnpm db:migrate

  db:migrate:dev:
    desc: Create a new Prisma migration from schema changes and apply it
    cmds:
      - pnpm db:migrate:dev

  db:generate:
    desc: Regenerate the Prisma client from the Prisma schema
    cmds:
      - pnpm db:generate
